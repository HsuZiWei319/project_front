services:
  frontend:
    build:
      context: .
      target: prod
      args:
        VITE_API_URL: ""
    container_name: upload-image-cont
    ports:
      - "0.0.0.0:5173:5173"
      - "0.0.0.0:8000:8000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    external: false
